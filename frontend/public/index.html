<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📚 小说创作助手</title>
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/babel-standalone@6/babel.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px 30px;
            text-align: center;
        }
        .header h1 { font-size: 26px; margin-bottom: 8px; }
        .header p { opacity: 0.9; font-size: 13px; }
        .stage-bar {
            display: flex;
            background: #f8f9fa;
            border-bottom: 1px solid #eee;
            padding: 15px 30px;
            gap: 10px;
        }
        .stage-item {
            flex: 1;
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            color: #999;
            background: #f0f0f0;
        }
        .stage-item.active {
            color: white;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .stage-item.completed {
            color: #2e7d32;
            background: #e8f5e9;
        }
        .content {
            padding: 30px;
            min-height: 400px;
        }
        .panel {
            display: none;
        }
        .panel.active {
            display: block;
        }
        textarea {
            width: 100%;
            min-height: 200px;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.6;
            resize: vertical;
            outline: none;
            transition: border-color 0.3s;
        }
        textarea:focus { border-color: #667eea; }
        .btn {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 14px;
            cursor: pointer;
            transition: transform 0.2s;
            margin-top: 15px;
        }
        .btn:hover { transform: scale(1.05); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .result {
            margin-top: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 12px;
            line-height: 1.6;
            white-space: pre-wrap;
        }
        .direction-card {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .direction-card:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }
        .direction-card.selected {
            border-color: #667eea;
            background: #f0f2ff;
        }
        .direction-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
        }
        .direction-info {
            font-size: 13px;
            color: #666;
            line-height: 1.6;
        }
        .info-row {
            margin-bottom: 5px;
        }
        .info-label {
            font-weight: 500;
            color: #333;
        }
        .loading {
            color: #999;
            font-style: italic;
            text-align: center;
            padding: 40px;
        }
        .error {
            color: #f44336;
            background: #ffebee;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
        }
        .success {
            color: #2e7d32;
            background: #e8f5e9;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect } = React;
        
        const STAGES = ['分析', '规划', '大纲', '生成', '校验'];
        
        function App() {
            const [currentStage, setCurrentStage] = useState(0);
            const [textInput, setTextInput] = useState('');
            const [result, setResult] = useState(null);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState(null);
            const [directions, setDirections] = useState([]);
            const [selectedDirection, setSelectedDirection] = useState(null);
            
            // 获取当前阶段
            useEffect(() => {
                fetch('/api/stage')
                    .then(res => res.json())
                    .then(data => {
                        const stageIndex = STAGES.indexOf(data.stage.charAt(0).toUpperCase() + data.stage.slice(1));
                        if (stageIndex >= 0) setCurrentStage(stageIndex);
                    })
                    .catch(() => {});
            }, []);
            
            // 提交分析
            const handleAnalysis = async () => {
                if (!textInput.trim()) {
                    setError('请输入原文内容');
                    return;
                }
                
                setLoading(true);
                setError(null);
                
                try {
                    const res = await fetch('/api/analysis', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ text: textInput })
                    });
                    const data = await res.json();
                    
                    if (data.error) {
                        setError(data.error);
                    } else {
                        setResult(data.result);
                        // 自动进入下一阶段
                        await fetch('/api/stage/confirm', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ stage: 'planning' })
                        });
                        setCurrentStage(1);
                    }
                } catch (err) {
                    setError('请求失败：' + err.message);
                } finally {
                    setLoading(false);
                }
            };
            
            // 生成规划
            const handlePlanning = async () => {
                if (!result?.metadata?.title) {
                    setError('请先完成分析');
                    return;
                }
                
                setLoading(true);
                setError(null);
                
                try {
                    // 模拟分析结果 ID
                    const analysisId = 'analysis_demo';
                    const res = await fetch('/api/planning', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ analysis_id: analysisId, directions: 3 })
                    });
                    const data = await res.json();
                    
                    if (data.error) {
                        setError(data.error);
                    } else {
                        setDirections(data.directions);
                    }
                } catch (err) {
                    setError('请求失败：' + err.message);
                } finally {
                    setLoading(false);
                }
            };
            
            // 确认方向
            const handleConfirmDirection = async (directionId) => {
                setSelectedDirection(directionId);
                
                try {
                    await fetch('/api/stage/confirm', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ stage: 'outline' })
                    });
                    setCurrentStage(2);
                } catch (err) {
                    setError('确认失败：' + err.message);
                }
            };
            
            return (
                <div className="container">
                    <div className="header">
                        <h1>📚 小说创作助手</h1>
                        <p>AI 多维度分析 + 创意续写 | 三省六部团队</p>
                    </div>
                    
                    <div className="stage-bar">
                        {STAGES.map((stage, index) => (
                            <div key={stage} className={`stage-item ${index === currentStage ? 'active' : index < currentStage ? 'completed' : ''}`}>
                                {index < currentStage ? '✅ ' : ''}{stage}
                            </div>
                        ))}
                    </div>
                    
                    <div className="content">
                        {/* 分析阶段 */}
                        <div className={`panel ${currentStage === 0 ? 'active' : ''}`}>
                            <h2>📖 第一步：原文分析</h2>
                            <p style={{ color: '#666', margin: '10px 0' }}>粘贴你的小说/网文原文，AI 将从 6+1 个维度进行分析</p>
                            <textarea
                                value={textInput}
                                onChange={e => setTextInput(e.target.value)}
                                placeholder="在此粘贴原文内容..."
                            />
                            <button className="btn" onClick={handleAnalysis} disabled={loading}>
                                {loading ? '分析中...' : '开始分析'}
                            </button>
                            {error && <div className="error">❌ {error}</div>}
                            {loading && <div className="loading">⏳ AI 正在分析中...</div>}
                            {result && (
                                <div className="result">
                                    <h3>✅ 分析完成</h3>
                                    <pre>{JSON.stringify(result, null, 2)}</pre>
                                </div>
                            )}
                        </div>
                        
                        {/* 规划阶段 */}
                        <div className={`panel ${currentStage === 1 ? 'active' : ''}`}>
                            <h2>🎯 第二步：创意规划</h2>
                            <p style={{ color: '#666', margin: '10px 0' }}>AI 将生成最多 3 个续写方向，请选择一个</p>
                            <button className="btn" onClick={handlePlanning} disabled={loading}>
                                {loading ? '生成中...' : '生成续写方向'}
                            </button>
                            {error && <div className="error">❌ {error}</div>}
                            {directions.length > 0 && (
                                <div style={{ marginTop: '20px' }}>
                                    <h3>📋 续写方向</h3>
                                    {directions.map((dir, index) => (
                                        <div
                                            key={dir.direction_id}
                                            className={`direction-card ${selectedDirection === dir.direction_id ? 'selected' : ''}`}
                                            onClick={() => handleConfirmDirection(dir.direction_id)}
                                        >
                                            <div className="direction-title">方向 {index + 1}</div>
                                            <div className="direction-info">
                                                <div className="info-row"><span className="info-label">核心冲突：</span>{dir.core_conflict}</div>
                                                <div className="info-row"><span className="info-label">主角目标：</span>{dir.protagonist_goal}</div>
                                                <div className="info-row"><span className="info-label">情绪走向：</span>{dir.emotion_trend}</div>
                                                <div className="info-row"><span className="info-label">与原文关系：</span>{dir.relation_to_original}</div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                        
                        {/* 大纲阶段 */}
                        <div className={`panel ${currentStage === 2 ? 'active' : ''}`}>
                            <h2>📝 第三步：大纲确认</h2>
                            <p style={{ color: '#666', margin: '10px 0' }}>根据选定的方向，生成卷级大纲和章节细纲</p>
                            <div className="result">
                                <p>📋 大纲功能开发中...</p>
                                <p>预计 2026-05-20 完成</p>
                            </div>
                        </div>
                        
                        {/* 生成阶段 */}
                        <div className={`panel ${currentStage === 3 ? 'active' : ''}`}>
                            <h2>✍️ 第四步：正文生成</h2>
                            <p style={{ color: '#666', margin: '10px 0' }}>按蓝图 + 细纲生成正文（800-1500 字/段）</p>
                            <div className="result">
                                <p>📋 生成功能开发中...</p>
                                <p>预计 2026-05-25 完成</p>
                            </div>
                        </div>
                        
                        {/* 校验阶段 */}
                        <div className={`panel ${currentStage === 4 ? 'active' : ''}`}>
                            <h2>✅ 第五步：一致性校验</h2>
                            <p style={{ color: '#666', margin: '10px 0' }}>OOC/设定/情绪/逻辑扫描</p>
                            <div className="result">
                                <p>📋 校验功能开发中...</p>
                                <p>预计 2026-05-28 完成</p>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }
        
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
